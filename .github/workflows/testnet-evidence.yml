name: Testnet Evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  base-sepolia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build vendored x402-guard
        run: |
          for pkg in core policy receipts middleware; do
            (cd "vendor/x402-guard/packages/$pkg" && npm install && npm run build)
          done
      - run: bun install
      - name: Base Sepolia settlement evidence
        run: bun run testnet-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: base-sepolia-evidence
          path: evidence/base-sepolia-live.json
