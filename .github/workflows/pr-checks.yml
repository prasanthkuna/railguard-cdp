name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build vendored x402-guard packages
        run: |
          for pkg in core policy receipts middleware; do
            (cd "vendor/x402-guard/packages/$pkg" && npm install && npm run build)
          done

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Lifecycle adversarial tests
        run: |
          bun test apps/api/payment-state.test.ts \
            apps/api/payment-lifecycle.test.ts \
            apps/api/reconcile.test.ts \
            apps/api/execution-claim.test.ts \
            packages/settlement/src/index.test.ts

      - name: Web typecheck
        run: bun run --filter @railguard/web typecheck

      - name: Web build
        run: bun run build:web
