name: PR Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout x402-guard
        uses: actions/checkout@v4
        with:
          repository: prasanthkuna/x402-guard
          path: x402-guard

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install Encore CLI
        run: |
          curl -L https://encore.dev/install.sh | bash
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build x402-guard packages
        run: |
          cd x402-guard/packages/core && bun run build
          cd ../policy && bun run build
          cd ../middleware && bun run build

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Lifecycle adversarial tests
        run: |
          bun test apps/api/payment-state.test.ts \
            apps/api/payment-lifecycle.test.ts \
            apps/api/reconcile.test.ts \
            apps/api/execution-claim.test.ts \
            packages/settlement/src/index.test.ts

      - name: Encore typecheck
        run: bun run typecheck

      - name: Web build
        run: bun run build:web
