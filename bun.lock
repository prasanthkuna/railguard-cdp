  "configVersion": 1,
  "workspaces": {
    "": {
      "name": "railguard",
    },
    "apps/api": {
      "name": "@railguard/api",
      "version": "0.1.0",
    },
    "apps/web": {
      "name": "@railguard/web",
      "version": "0.1.0",
    },
    "packages/audit": {
      "name": "@railguard/audit",
      "version": "0.1.0",
    },
    "packages/auth": {
      "name": "@railguard/auth",
      "version": "0.1.0",
    },
    "packages/cdp": {
      "name": "@railguard/cdp",
